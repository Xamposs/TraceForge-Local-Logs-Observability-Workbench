<?xml version="1.0" encoding="UTF-8"?>
<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 360" role="img" aria-label="TraceForge — Local Logs and Observability Workbench">
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#1c1f24"/>
      <stop offset="1" stop-color="#10131a"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#4a8cff"/>
      <stop offset="1" stop-color="#7ad3ff"/>
    </linearGradient>
  </defs>
  <rect width="1200" height="360" fill="url(#bg)"/>
  <!-- decorative timeline motif -->
  <g stroke="#2a313d" stroke-width="1">
    <line x1="0" y1="280" x2="1200" y2="280"/>
    <line x1="0" y1="240" x2="1200" y2="240"/>
    <line x1="0" y1="200" x2="1200" y2="200"/>
  </g>
  <g fill="url(#accent)">
    <rect x="40"   y="240" width="2" height="20"/>
    <rect x="120"  y="220" width="2" height="40"/>
    <rect x="200"  y="180" width="2" height="80"/>
    <rect x="280"  y="200" width="2" height="60"/>
    <rect x="360"  y="160" width="2" height="100"/>
    <rect x="440"  y="190" width="2" height="70"/>
    <rect x="520"  y="170" width="2" height="90"/>
    <rect x="600"  y="210" width="2" height="50"/>
    <rect x="680"  y="150" width="2" height="110"/>
    <rect x="760"  y="200" width="2" height="60"/>
    <rect x="840"  y="180" width="2" height="80"/>
    <rect x="920"  y="220" width="2" height="40"/>
    <rect x="1000" y="170" width="2" height="90"/>
    <rect x="1080" y="190" width="2" height="70"/>
  </g>
  <!-- markers for events -->
  <g fill="#e26161">
    <circle cx="200" cy="180" r="4"/>
    <circle cx="680" cy="150" r="4"/>
  </g>
  <g fill="#d8a13a">
    <circle cx="360" cy="160" r="4"/>
    <circle cx="1000" cy="170" r="4"/>
  </g>
  <!-- title -->
  <text x="600" y="100" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="62" font-weight="700" letter-spacing="6"
        fill="#e3e6ea" text-anchor="middle">TRACEFORGE</text>
  <text x="600" y="138" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="20" font-weight="400" letter-spacing="2"
        fill="#aab0b8" text-anchor="middle">Local Logs &amp; Observability Workbench</text>
  <text x="600" y="172" font-family="Segoe UI, Helvetica, Arial, sans-serif"
        font-size="14" font-weight="400" letter-spacing="6"
        fill="#6c727b" text-anchor="middle">INSPECT  ·  QUERY  ·  CORRELATE  ·  UNDERSTAND</text>
</svg>
