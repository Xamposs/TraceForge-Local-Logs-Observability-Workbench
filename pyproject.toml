[build-system]
requires = ["setuptools>=68", "wheel"]
build-backend = "setuptools.build_meta"

[project]
name = "traceforge"
version = "0.1.0"
description = "Local-first desktop observability workbench for inspecting, querying, correlating, and monitoring logs."
readme = "README.md"
requires-python = ">=3.12"
license = "MIT"
authors = [
    { name = "Xamposs" },
]
keywords = [
    "logs",
    "observability",
    "log-viewer",
    "duckdb",
    "desktop",
    "pyside6",
    "local-first",
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Environment :: X11 Applications :: Qt",
    "Intended Audience :: Developers",
    "Intended Audience :: System Administrators",
    "Operating System :: Microsoft :: Windows :: Windows 11",
    "Operating System :: POSIX :: Linux",
    "Operating System :: MacOS",
    "Programming Language :: Python :: 3.12",
    "Topic :: System :: Logging",
    "Topic :: System :: Monitoring",
    "Topic :: Utilities",
]

dependencies = [
    "PySide6>=6.7,<6.9",
    "duckdb>=1.0,<2.0",
    "polars>=1.0,<2.0",
    "pyqtgraph>=0.13,<1.0",
    "watchdog>=4.0,<7.0",
    "pydantic>=2.5,<3.0",
    "pytz>=2024.1",
    "pyarrow>=15.0",
]

[project.optional-dependencies]
dev = [
    "pytest>=8.0",
    "pytest-qt>=4.4",
    "ruff==0.7.2",
    "build>=1.2",
]

[project.scripts]
traceforge = "traceforge.cli:main"

[project.urls]
Homepage = "https://github.com/Xamposs/TraceForge-Local-Logs-Observability-Workbench"
Issues = "https://github.com/Xamposs/TraceForge-Local-Logs-Observability-Workbench/issues"

[tool.setuptools.packages.find]
include = ["traceforge*"]
exclude = ["tests*", "benchmarks*", "docs*", "assets*"]

[tool.setuptools.package-data]
traceforge = [
    "resources/*.svg",
    "resources/*.qss",
    "resources/*.txt",
]

[tool.pytest.ini_options]
minversion = "8.0"
testpaths = ["tests"]
addopts = [
    "-ra",
    "--strict-markers",
    "--strict-config",
    "--tb=short",
]
qt_api = "pyside6"
filterwarnings = [
    "ignore::DeprecationWarning:pkg_resources",
    "ignore::DeprecationWarning:watchdog",
]
markers = [
    "ui: requires a Qt platform; runs in offscreen mode in CI",
    "slow: heavy performance test (skipped by default)",
]

[tool.ruff]
line-length = 110
target-version = "py312"
extend-exclude = [".venv", "build", "dist", "benchmarks/_generated"]

[tool.ruff.lint]
select = [
    "E",
    "F",
    "W",
    "I",
    "B",
    "UP",
    "SIM",
    "RUF",
]
ignore = [
    "E501",
    "E702",
    "E741",
    "B008",
    "B017",
    "B904",
    "F841",
    "SIM102",
    "SIM105",
    "SIM108",
    "SIM115",
    "UP038",
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["B011", "E402"]
"benchmarks/*" = ["E402"]
"docs/*" = ["E402"]
